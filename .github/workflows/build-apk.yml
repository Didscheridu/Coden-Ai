# Baut für eine Coden-App eine Android-APK (WebView-Hülle, die die Coden-Adresse der App öffnet)
# und legt sie als GitHub-Release "apk-<adresse>" ab. Gestartet vom Coden-Backend (server/apk.js).
name: Android-APK bauen
run-name: APK ${{ inputs.slug || 'test' }} ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      slug: { description: 'Coden-Adresse der App', required: true, type: string }
      name: { description: 'App-Name', required: true, type: string }
      url: { description: 'https-Adresse der App', required: true, type: string }
      color: { description: 'Farbe #RRGGBB', required: false, type: string, default: '#8ab4f8' }
      package_id: { description: 'Android-Paketname', required: true, type: string }
      request_id: { description: 'Kennung der Anfrage', required: true, type: string }
  pull_request:
    paths: ['android-shell/**', 'server/icon.js', '.github/workflows/build-apk.yml']

permissions:
  contents: write

concurrency:
  group: apk-${{ inputs.slug || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Eingaben nur über Umgebungsvariablen verwenden (nie direkt in Skripte einsetzen)
      IN_SLUG: ${{ inputs.slug || 'demo-test' }}
      IN_NAME: ${{ inputs.name || 'Coden Demo' }}
      IN_URL: ${{ inputs.url || 'https://coden-ai.vercel.app/a/demo-test/' }}
      IN_COLOR: ${{ inputs.color || '#8ab4f8' }}
      IN_PKG: ${{ inputs.package_id || 'app.coden.demo_test' }}
      IN_REQ: ${{ inputs.request_id || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Eingaben prüfen und Symbole erzeugen
        run: node android-shell/prepare.js

      - name: Signierschlüssel
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/coden.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            { echo "KS_PASS=$KS_PASS_SECRET"; echo "KS_ALIAS=${KS_ALIAS_SECRET:-coden}"; } >> "$GITHUB_ENV"
          else
            echo "::warning::Kein fester Schlüssel (Secret ANDROID_KEYSTORE_B64). Updates erfordern dann vorheriges Deinstallieren."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias coden -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Coden App"
            { echo "KS_PASS=$PASS"; echo "KS_ALIAS=coden"; } >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android-shell
        run: gradle assembleRelease --no-daemon --stacktrace -PappId="$APP_ID" -PappName="$APP_NAME" -PappUrl="$APP_URL" -PappColor="$APP_COLOR" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: APK prüfen und bereitlegen
        run: |
          APK=android-shell/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/aapt" dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)"
          cp "$APK" "$RUNNER_TEMP/$IN_SLUG.apk" && ls -l "$RUNNER_TEMP/$IN_SLUG.apk"

      - name: Als Release veröffentlichen
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "apk-$IN_SLUG" --yes --cleanup-tag || true
          gh release create "apk-$IN_SLUG" "$RUNNER_TEMP/$IN_SLUG.apk" --target "$GITHUB_SHA" --latest=false \
            --title "$APP_NAME (Android-App)" --notes "Gebaut von Coden für $IN_URL – request:$IN_REQ"

      - name: Test-APK hochladen
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with: { name: coden-test-apk, path: '${{ runner.temp }}/*.apk', retention-days: 3 }
